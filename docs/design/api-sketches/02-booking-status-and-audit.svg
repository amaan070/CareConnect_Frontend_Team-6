<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#0f826d"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#173f39" flood-opacity=".08"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}</style></defs><rect width="1600" height="1100" fill="#f4f8f6"/><rect width="1600" height="14" fill="#0f826d"/><text x="64" y="60" font-size="15" fill="#0f826d" font-weight="700"><tspan x="64" dy="0">API SKETCH 2 OF 4</tspan></text><text x="64" y="102" font-size="34" fill="#173f39" font-weight="750"><tspan x="64" dy="0">Booking, status lifecycle and audit</tspan></text><text x="64" y="137" font-size="17" fill="#637d76" font-weight="400"><tspan x="64" dy="0">The transactional write path and its read-only ledger endpoint.</tspan></text><text x="64" y="188" font-size="14" fill="#0f826d" font-weight="800"><tspan x="64" dy="0">BOOKING TRANSACTION</tspan></text>
<rect x="64" y="210" width="250" height="95" rx="18" fill="#fff" stroke="#cfddd8" stroke-width="2"/><rect x="64" y="210" width="10" height="95" rx="5" fill="#b85c18"/><text x="92" y="246" font-size="20" fill="#173f39" font-weight="750"><tspan x="92" dy="0">POST booking</tspan></text><text x="92" y="276" font-size="14" fill="#637d76" font-weight="500"><tspan x="92" dy="0">patient_id · clinic_id</tspan><tspan x="92" dy="20">copay_amount</tspan></text><rect x="365" y="210" width="250" height="95" rx="18" fill="#fff" stroke="#cfddd8" stroke-width="2"/><rect x="365" y="210" width="10" height="95" rx="5" fill="#396b88"/><text x="393" y="246" font-size="20" fill="#173f39" font-weight="750"><tspan x="393" dy="0">Lock patient</tspan></text><text x="393" y="276" font-size="14" fill="#637d76" font-weight="500"><tspan x="393" dy="0">BEGIN</tspan><tspan x="393" dy="20">balance BEFORE</tspan></text><rect x="666" y="210" width="250" height="95" rx="18" fill="#fff" stroke="#cfddd8" stroke-width="2"/><rect x="666" y="210" width="10" height="95" rx="5" fill="#396b88"/><text x="694" y="246" font-size="20" fill="#173f39" font-weight="750"><tspan x="694" dy="0">Stored procedure</tspan></text><text x="694" y="276" font-size="14" fill="#637d76" font-weight="500"><tspan x="694" dy="0">book_appointment</tspan><tspan x="694" dy="20">debit + insert</tspan></text><rect x="967" y="210" width="250" height="95" rx="18" fill="#fff" stroke="#cfddd8" stroke-width="2"/><rect x="967" y="210" width="10" height="95" rx="5" fill="#0f826d"/><text x="995" y="246" font-size="20" fill="#173f39" font-weight="750"><tspan x="995" dy="0">Audit trigger</tspan></text><text x="995" y="276" font-size="14" fill="#637d76" font-weight="500"><tspan x="995" dy="0">wallet_audit_logs</tspan><tspan x="995" dy="20">balance AFTER</tspan></text><rect x="1268" y="210" width="268" height="95" rx="18" fill="#fff" stroke="#cfddd8" stroke-width="2"/><rect x="1268" y="210" width="10" height="95" rx="5" fill="#b85c18"/><text x="1296" y="246" font-size="20" fill="#173f39" font-weight="750"><tspan x="1296" dy="0">Commit receipt</tspan></text><text x="1296" y="276" font-size="14" fill="#637d76" font-weight="500"><tspan x="1296" dy="0">appointment + HSA</tspan><tspan x="1296" dy="20">latest audit row</tspan></text>
<path d="M314 258 L365 258" stroke="#0f826d" stroke-width="3" marker-end="url(#arrow)"/><path d="M615 258 L666 258" stroke="#0f826d" stroke-width="3" marker-end="url(#arrow)"/><path d="M916 258 L967 258" stroke="#0f826d" stroke-width="3" marker-end="url(#arrow)"/><path d="M1217 258 L1268 258" stroke="#0f826d" stroke-width="3" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="64" y="350" width="704" height="250" rx="18" fill="#fff" stroke="#cfddd8" stroke-width="2"/></g><rect x="86" y="370" width="78" height="32" rx="16" fill="#b85c18"/><text x="103" y="392" font-size="14" fill="#fff" font-weight="800"><tspan x="103" dy="0">POST</tspan></text><text class="mono" x="180" y="393" font-size="18" fill="#173f39" font-weight="700">/api/bookings</text><rect x="650" y="370" width="94" height="30" rx="15" fill="#396b88" opacity=".12"/><text x="667" y="390" font-size="13" fill="#396b88" font-weight="700"><tspan x="667" dy="0">PostgreSQL</tspan></text><text x="88" y="422" font-size="13" fill="#0f826d" font-weight="800"><tspan x="88" dy="0">INPUT</tspan></text><text x="88" y="446" font-size="15" fill="#173f39" font-weight="500"><tspan x="88" dy="0">body: patient_id, clinic_id, copay_amount</tspan><tspan x="88" dy="20">required; copay must not be negative</tspan></text><text x="88" y="500" font-size="13" fill="#0f826d" font-weight="800"><tspan x="88" dy="0">OUTPUT</tspan></text><text x="88" y="524" font-size="15" fill="#173f39" font-weight="500"><tspan x="88" dy="0">201 { message, hsa:{before,after,amount_charged},</tspan><tspan x="88" dy="20">appointment, audit_log }</tspan></text><text x="88" y="584" font-size="12" fill="#637d76" font-weight="500"><tspan x="88" dy="0">400 business/validation · 404 patient · 409 active appointment · 500</tspan></text>
<g filter="url(#shadow)"><rect x="800" y="350" width="736" height="250" rx="18" fill="#fff" stroke="#cfddd8" stroke-width="2"/></g><rect x="822" y="370" width="78" height="32" rx="16" fill="#6f4aae"/><text x="839" y="392" font-size="14" fill="#fff" font-weight="800"><tspan x="839" dy="0">PATCH</tspan></text><text class="mono" x="916" y="393" font-size="18" fill="#173f39" font-weight="700">/api/appointments/:id/status</text><rect x="1418" y="370" width="94" height="30" rx="15" fill="#396b88" opacity=".12"/><text x="1435" y="390" font-size="13" fill="#396b88" font-weight="700"><tspan x="1435" dy="0">PostgreSQL</tspan></text><text x="824" y="422" font-size="13" fill="#0f826d" font-weight="800"><tspan x="824" dy="0">INPUT</tspan></text><text x="824" y="446" font-size="15" fill="#173f39" font-weight="500"><tspan x="824" dy="0">path: appointment UUID</tspan><tspan x="824" dy="20">body: { status }</tspan></text><text x="824" y="500" font-size="13" fill="#0f826d" font-weight="800"><tspan x="824" dy="0">OUTPUT</tspan></text><text x="824" y="524" font-size="15" fill="#173f39" font-weight="500"><tspan x="824" dy="0">200 { message, appointment }</tspan></text><text x="824" y="584" font-size="12" fill="#637d76" font-weight="500"><tspan x="824" dy="0">WAITING → IN_CONSULTATION → DISCHARGED only · 400/404/500</tspan></text>
<g filter="url(#shadow)"><rect x="64" y="635" width="704" height="250" rx="18" fill="#fff" stroke="#cfddd8" stroke-width="2"/></g><rect x="86" y="655" width="78" height="32" rx="16" fill="#176b87"/><text x="103" y="677" font-size="14" fill="#fff" font-weight="800"><tspan x="103" dy="0">GET</tspan></text><text class="mono" x="180" y="678" font-size="18" fill="#173f39" font-weight="700">/api/audit-logs/:patientId</text><rect x="650" y="655" width="94" height="30" rx="15" fill="#396b88" opacity=".12"/><text x="667" y="675" font-size="13" fill="#396b88" font-weight="700"><tspan x="667" dy="0">PostgreSQL</tspan></text><text x="88" y="707" font-size="13" fill="#0f826d" font-weight="800"><tspan x="88" dy="0">INPUT</tspan></text><text x="88" y="731" font-size="15" fill="#173f39" font-weight="500"><tspan x="88" dy="0">path: patient UUID</tspan><tspan x="88" dy="20">query: optional from, to timestamps</tspan></text><text x="88" y="785" font-size="13" fill="#0f826d" font-weight="800"><tspan x="88" dy="0">OUTPUT</tspan></text><text x="88" y="809" font-size="15" fill="#173f39" font-weight="500"><tspan x="88" dy="0">{ patient_id, logs:[ amount_changed,</tspan><tspan x="88" dy="20">action_type, balance_after, running_change ] }</tspan></text><text x="88" y="869" font-size="12" fill="#637d76" font-weight="500"><tspan x="88" dy="0">Oldest-first ordering in the supplied route · 500 on query failure</tspan></text>
<rect x="800" y="635" width="736" height="250" rx="18" fill="#fff9ee" stroke="#e8d3ad" stroke-width="2"/><text x="826" y="674" font-size="14" fill="#94661a" font-weight="800"><tspan x="826" dy="0">STATUS AND ERROR SKETCH</tspan></text>
<text x="826" y="716" font-size="17" fill="#173f39" font-weight="800"><tspan x="826" dy="0">P0001</tspan></text><text x="944" y="716" font-size="16" fill="#637d76" font-weight="500"><tspan x="944" dy="0">Stored procedure business error → 400</tspan></text><text x="826" y="758" font-size="17" fill="#173f39" font-weight="800"><tspan x="826" dy="0">23505</tspan></text><text x="944" y="758" font-size="16" fill="#637d76" font-weight="500"><tspan x="944" dy="0">Partial unique index conflict → 409</tspan></text><text x="826" y="800" font-size="17" fill="#173f39" font-weight="800"><tspan x="826" dy="0">Missing ID</tspan></text><text x="944" y="800" font-size="16" fill="#637d76" font-weight="500"><tspan x="944" dy="0">Patient/appointment not found → 404</tspan></text><text x="826" y="842" font-size="17" fill="#173f39" font-weight="800"><tspan x="826" dy="0">Other</tspan></text><text x="944" y="842" font-size="16" fill="#637d76" font-weight="500"><tspan x="944" dy="0">Rollback transaction → 500</tspan></text>
<rect x="64" y="920" width="1472" height="78" rx="18" fill="#dff0e9" stroke="#cfddd8" stroke-width="2"/><text x="92" y="955" font-size="17" fill="#173f39" font-weight="650"><tspan x="92" dy="0">Core guarantee: booking, HSA debit, appointment insert and trigger-generated audit entry share one transaction.</tspan></text><line x1="64" y1="1052" x2="1536" y2="1052" stroke="#cfddd8"/><text x="64" y="1078" font-size="14" fill="#637d76" font-weight="500"><tspan x="64" dy="0">Source: supplied api.zip · PostgreSQL procedure, trigger and partial unique index</tspan></text><text x="1435" y="1078" font-size="14" fill="#0f826d" font-weight="700"><tspan x="1435" dy="0">CareConnect</tspan></text></svg>
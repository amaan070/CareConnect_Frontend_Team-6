<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#0f826d"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#173f39" flood-opacity=".08"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}</style></defs><rect width="1600" height="1100" fill="#f4f8f6"/><rect width="1600" height="14" fill="#0f826d"/><text x="64" y="60" font-size="15" fill="#0f826d" font-weight="700"><tspan x="64" dy="0">API SKETCH 4 OF 4</tspan></text><text x="64" y="102" font-size="34" fill="#173f39" font-weight="750"><tspan x="64" dy="0">Map, reviews, catalog and diagnostics</tspan></text><text x="64" y="137" font-size="17" fill="#637d76" font-weight="400"><tspan x="64" dy="0">MongoDB-backed read endpoints plus simple connection checks.</tspan></text><text x="64" y="188" font-size="14" fill="#0f826d" font-weight="800"><tspan x="64" dy="0">MONGODB READ FLOWS</tspan></text>
<g filter="url(#shadow)"><rect x="64" y="210" width="704" height="250" rx="18" fill="#fff" stroke="#cfddd8" stroke-width="2"/></g><rect x="86" y="230" width="78" height="32" rx="16" fill="#176b87"/><text x="103" y="252" font-size="14" fill="#fff" font-weight="800"><tspan x="103" dy="0">GET</tspan></text><text class="mono" x="180" y="253" font-size="18" fill="#173f39" font-weight="700">/api/map/nearest-nurses</text><rect x="650" y="230" width="94" height="30" rx="15" fill="#3f7f4c" opacity=".12"/><text x="667" y="250" font-size="13" fill="#3f7f4c" font-weight="700"><tspan x="667" dy="0">MongoDB</tspan></text><text x="88" y="282" font-size="13" fill="#0f826d" font-weight="800"><tspan x="88" dy="0">INPUT</tspan></text><text x="88" y="306" font-size="15" fill="#173f39" font-weight="500"><tspan x="88" dy="0">query: latitude, longitude; optional limit (1–100)</tspan></text><text x="88" y="336" font-size="13" fill="#0f826d" font-weight="800"><tspan x="88" dy="0">OUTPUT</tspan></text><text x="88" y="360" font-size="15" fill="#173f39" font-weight="500"><tspan x="88" dy="0">{ origin, radius_meters:5000, count,</tspan><tspan x="88" dy="20">nurses:[ nurse_id, location, created_at, distance_meters ] }</tspan></text><text x="88" y="444" font-size="12" fill="#637d76" font-weight="500"><tspan x="88" dy="0">Latest ping per nurse → active → Haversine ≤5 km → distance sort</tspan></text>
<g filter="url(#shadow)"><rect x="800" y="210" width="736" height="250" rx="18" fill="#fff" stroke="#cfddd8" stroke-width="2"/></g><rect x="822" y="230" width="78" height="32" rx="16" fill="#176b87"/><text x="839" y="252" font-size="14" fill="#fff" font-weight="800"><tspan x="839" dy="0">GET</tspan></text><text class="mono" x="916" y="253" font-size="18" fill="#173f39" font-weight="700">/api/reviews/analytics</text><rect x="1418" y="230" width="94" height="30" rx="15" fill="#3f7f4c" opacity=".12"/><text x="1435" y="250" font-size="13" fill="#3f7f4c" font-weight="700"><tspan x="1435" dy="0">MongoDB</tspan></text><text x="824" y="282" font-size="13" fill="#0f826d" font-weight="800"><tspan x="824" dy="0">INPUT</tspan></text><text x="824" y="306" font-size="15" fill="#173f39" font-weight="500"><tspan x="824" dy="0">no request parameters</tspan></text><text x="824" y="336" font-size="13" fill="#0f826d" font-weight="800"><tspan x="824" dy="0">OUTPUT</tspan></text><text x="824" y="360" font-size="15" fill="#173f39" font-weight="500"><tspan x="824" dy="0">{ rating_buckets, top_sentiment_tags,</tspan><tspan x="824" dy="20">global_average }</tspan></text><text x="824" y="444" font-size="12" fill="#637d76" font-weight="500"><tspan x="824" dy="0">One MongoDB $facet · top 10 tags · average rounded to 2 decimals</tspan></text>
<g filter="url(#shadow)"><rect x="64" y="500" width="704" height="250" rx="18" fill="#fff" stroke="#cfddd8" stroke-width="2"/></g><rect x="86" y="520" width="78" height="32" rx="16" fill="#176b87"/><text x="103" y="542" font-size="14" fill="#fff" font-weight="800"><tspan x="103" dy="0">GET</tspan></text><text class="mono" x="180" y="543" font-size="18" fill="#173f39" font-weight="700">/api/reviews/catalogs</text><rect x="650" y="520" width="94" height="30" rx="15" fill="#3f7f4c" opacity=".12"/><text x="667" y="540" font-size="13" fill="#3f7f4c" font-weight="700"><tspan x="667" dy="0">MongoDB</tspan></text><text x="88" y="572" font-size="13" fill="#0f826d" font-weight="800"><tspan x="88" dy="0">INPUT</tspan></text><text x="88" y="596" font-size="15" fill="#173f39" font-weight="500"><tspan x="88" dy="0">query: clinic_id, type, page, limit</tspan><tspan x="88" dy="20">type: specialist_availability | medication</tspan></text><text x="88" y="650" font-size="13" fill="#0f826d" font-weight="800"><tspan x="88" dy="0">OUTPUT</tspan></text><text x="88" y="674" font-size="15" fill="#173f39" font-weight="500"><tspan x="88" dy="0">{ catalogs, page, limit, total, totalPages }</tspan></text><text x="88" y="734" font-size="12" fill="#637d76" font-weight="500"><tspan x="88" dy="0">400 invalid type · 500 database failure</tspan></text>
<rect x="800" y="500" width="736" height="250" rx="18" fill="#dff0e9" stroke="#cfddd8" stroke-width="2"/><text x="826" y="540" font-size="14" fill="#0f826d" font-weight="800"><tspan x="826" dy="0">MAP ALGORITHM</tspan></text><text x="826" y="582" font-size="17" fill="#173f39" font-weight="750"><tspan x="826" dy="0">NursePings</tspan></text><path d="M946 576 L1042 576" stroke="#0f826d" stroke-width="3" marker-end="url(#arrow)"/><text x="1060" y="582" font-size="17" fill="#173f39" font-weight="750"><tspan x="1060" dy="0">latest / nurse</tspan></text><path d="M1200 576 L1292 576" stroke="#0f826d" stroke-width="3" marker-end="url(#arrow)"/><text x="1310" y="582" font-size="17" fill="#173f39" font-weight="750"><tspan x="1310" dy="0">active only</tspan></text><text x="826" y="634" font-size="17" fill="#173f39" font-weight="750"><tspan x="826" dy="0">Haversine distance in Node.js</tspan></text><path d="M1085 628 L1180 628" stroke="#0f826d" stroke-width="3" marker-end="url(#arrow)"/><text x="1198" y="634" font-size="17" fill="#173f39" font-weight="750"><tspan x="1198" dy="0">≤ 5,000 m</tspan></text><text x="826" y="686" font-size="17" fill="#173f39" font-weight="750"><tspan x="826" dy="0">sort ascending</tspan></text><path d="M974 680 L1080 680" stroke="#0f826d" stroke-width="3" marker-end="url(#arrow)"/><text x="1098" y="686" font-size="17" fill="#173f39" font-weight="750"><tspan x="1098" dy="0">slice to limit</tspan></text><text x="826" y="724" font-size="15" fill="#637d76" font-weight="500"><tspan x="826" dy="0">Coordinates follow GeoJSON order: [longitude, latitude].</tspan></text>

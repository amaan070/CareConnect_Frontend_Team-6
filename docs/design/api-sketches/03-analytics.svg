<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#0f826d"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#173f39" flood-opacity=".08"/></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}</style></defs><rect width="1600" height="1100" fill="#f4f8f6"/><rect width="1600" height="14" fill="#0f826d"/><text x="64" y="60" font-size="15" fill="#0f826d" font-weight="700"><tspan x="64" dy="0">API SKETCH 3 OF 4</tspan></text><text x="64" y="102" font-size="34" fill="#173f39" font-weight="750"><tspan x="64" dy="0">Analytics endpoints</tspan></text><text x="64" y="137" font-size="17" fill="#637d76" font-weight="400"><tspan x="64" dy="0">Revenue windows, dense ranking and materialized discharge summaries.</tspan></text><text x="64" y="188" font-size="14" fill="#0f826d" font-weight="800"><tspan x="64" dy="0">POSTGRESQL ANALYTICS PIPELINE</tspan></text>
<rect x="64" y="210" width="260" height="100" rx="18" fill="#fff" stroke="#cfddd8" stroke-width="2"/><rect x="64" y="210" width="10" height="100" rx="5" fill="#396b88"/><text x="92" y="246" font-size="20" fill="#173f39" font-weight="750"><tspan x="92" dy="0">Appointments</tspan></text><text x="92" y="276" font-size="14" fill="#637d76" font-weight="500"><tspan x="92" dy="0">DISCHARGED rows</tspan><tspan x="92" dy="20">created_at + copay</tspan></text><rect x="380" y="210" width="260" height="100" rx="18" fill="#fff" stroke="#cfddd8" stroke-width="2"/><rect x="380" y="210" width="10" height="100" rx="5" fill="#396b88"/><text x="408" y="246" font-size="20" fill="#173f39" font-weight="750"><tspan x="408" dy="0">Daily revenue</tspan></text><text x="408" y="276" font-size="14" fill="#637d76" font-weight="500"><tspan x="408" dy="0">GROUP BY clinic/day</tspan><tspan x="408" dy="20">SUM(copay_amount)</tspan></text><rect x="696" y="210" width="260" height="100" rx="18" fill="#fff" stroke="#cfddd8" stroke-width="2"/><rect x="696" y="210" width="10" height="100" rx="5" fill="#0f826d"/><text x="724" y="246" font-size="20" fill="#173f39" font-weight="750"><tspan x="724" dy="0">7-row average</tspan></text><text x="724" y="276" font-size="14" fill="#637d76" font-weight="500"><tspan x="724" dy="0">ROWS 6 PRECEDING</tspan><tspan x="724" dy="20">per clinic</tspan></text><rect x="1012" y="210" width="260" height="100" rx="18" fill="#fff" stroke="#cfddd8" stroke-width="2"/><rect x="1012" y="210" width="10" height="100" rx="5" fill="#0f826d"/><text x="1040" y="246" font-size="20" fill="#173f39" font-weight="750"><tspan x="1040" dy="0">Dense rank</tspan></text><text x="1040" y="276" font-size="14" fill="#637d76" font-weight="500"><tspan x="1040" dy="0">per revenue_date</tspan><tspan x="1040" dy="20">highest average first</tspan></text><rect x="1328" y="210" width="208" height="100" rx="18" fill="#fff" stroke="#cfddd8" stroke-width="2"/><rect x="1328" y="210" width="10" height="100" rx="5" fill="#b85c18"/><text x="1356" y="246" font-size="20" fill="#173f39" font-weight="750"><tspan x="1356" dy="0">JSON</tspan></text><text x="1356" y="276" font-size="14" fill="#637d76" font-weight="500"><tspan x="1356" dy="0">analytics[]</tspan><tspan x="1356" dy="20">ordered result</tspan></text>

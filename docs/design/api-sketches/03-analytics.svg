<g filter="url(#shadow)"><rect x="64" y="360" width="704" height="245" rx="18" fill="#fff" stroke="#cfddd8" stroke-width="2"/></g><rect x="86" y="380" width="78" height="32" rx="16" fill="#176b87"/><text x="103" y="402" font-size="14" fill="#fff" font-weight="800"><tspan x="103" dy="0">GET</tspan></text><text class="mono" x="180" y="403" font-size="18" fill="#173f39" font-weight="700">/api/analytics/clinic-revenue</text><rect x="650" y="380" width="94" height="30" rx="15" fill="#396b88" opacity=".12"/><text x="667" y="400" font-size="13" fill="#396b88" font-weight="700"><tspan x="667" dy="0">PostgreSQL</tspan></text><text x="88" y="432" font-size="13" fill="#0f826d" font-weight="800"><tspan x="88" dy="0">INPUT</tspan></text><text x="88" y="456" font-size="15" fill="#173f39" font-weight="500"><tspan x="88" dy="0">no request parameters</tspan></text><text x="88" y="486" font-size="13" fill="#0f826d" font-weight="800"><tspan x="88" dy="0">OUTPUT</tspan></text><text x="88" y="510" font-size="15" fill="#173f39" font-weight="500"><tspan x="88" dy="0">{ analytics:[ clinic_id, clinic_name, revenue_date,</tspan><tspan x="88" dy="20">daily_revenue, moving_7_day_average, clinic_rank ] }</tspan></text><text x="88" y="589" font-size="12" fill="#637d76" font-weight="500"><tspan x="88" dy="0">All results returned · ordered newest date, then rank · 500 on failure</tspan></text>
<g filter="url(#shadow)"><rect x="800" y="360" width="736" height="245" rx="18" fill="#fff" stroke="#cfddd8" stroke-width="2"/></g><rect x="822" y="380" width="78" height="32" rx="16" fill="#176b87"/><text x="839" y="402" font-size="14" fill="#fff" font-weight="800"><tspan x="839" dy="0">GET</tspan></text><text class="mono" x="916" y="403" font-size="18" fill="#173f39" font-weight="700">/api/analytics/discharges</text><rect x="1418" y="380" width="94" height="30" rx="15" fill="#396b88" opacity=".12"/><text x="1435" y="400" font-size="13" fill="#396b88" font-weight="700"><tspan x="1435" dy="0">PostgreSQL</tspan></text><text x="824" y="432" font-size="13" fill="#0f826d" font-weight="800"><tspan x="824" dy="0">INPUT</tspan></text><text x="824" y="456" font-size="15" fill="#173f39" font-weight="500"><tspan x="824" dy="0">no request parameters</tspan></text><text x="824" y="486" font-size="13" fill="#0f826d" font-weight="800"><tspan x="824" dy="0">OUTPUT</tspan></text><text x="824" y="510" font-size="15" fill="#173f39" font-weight="500"><tspan x="824" dy="0">{ summary:[ clinic_id, clinic_name,</tspan><tspan x="824" dy="20">discharge_month, total_discharges ] }</tspan></text><text x="824" y="589" font-size="12" fill="#637d76" font-weight="500"><tspan x="824" dy="0">Reads mv_clinic_monthly_discharges · newest month first</tspan></text>
<g filter="url(#shadow)"><rect x="64" y="645" width="704" height="230" rx="18" fill="#fff" stroke="#cfddd8" stroke-width="2"/></g><rect x="86" y="665" width="78" height="32" rx="16" fill="#b85c18"/><text x="103" y="687" font-size="14" fill="#fff" font-weight="800"><tspan x="103" dy="0">POST</tspan></text><text class="mono" x="180" y="688" font-size="18" fill="#173f39" font-weight="700">/api/analytics/discharges/refresh</text><rect x="650" y="665" width="94" height="30" rx="15" fill="#396b88" opacity=".12"/><text x="667" y="685" font-size="13" fill="#396b88" font-weight="700"><tspan x="667" dy="0">PostgreSQL</tspan></text><text x="88" y="717" font-size="13" fill="#0f826d" font-weight="800"><tspan x="88" dy="0">INPUT</tspan></text><text x="88" y="741" font-size="15" fill="#173f39" font-weight="500"><tspan x="88" dy="0">no request body required</tspan></text><text x="88" y="771" font-size="13" fill="#0f826d" font-weight="800"><tspan x="88" dy="0">OUTPUT</tspan></text><text x="88" y="795" font-size="15" fill="#173f39" font-weight="500"><tspan x="88" dy="0">200 { message: summary refreshed }</tspan></text><text x="88" y="859" font-size="12" fill="#637d76" font-weight="500"><tspan x="88" dy="0">Runs REFRESH MATERIALIZED VIEW · 500 includes details</tspan></text>
<rect x="800" y="645" width="736" height="230" rx="18" fill="#dff0e9" stroke="#cfddd8" stroke-width="2"/><text x="826" y="684" font-size="14" fill="#0f826d" font-weight="800"><tspan x="826" dy="0">MATERIALIZED VIEW FLOW</tspan></text><text x="826" y="728" font-size="18" fill="#173f39" font-weight="750"><tspan x="826" dy="0">Refresh request</tspan></text><path d="M990 722 L1115 722" stroke="#0f826d" stroke-width="3" marker-end="url(#arrow)"/><text x="1133" y="728" font-size="18" fill="#173f39" font-weight="750"><tspan x="1133" dy="0">REFRESH VIEW</tspan></text><path d="M1300 722 L1400 722" stroke="#0f826d" stroke-width="3" marker-end="url(#arrow)"/><text x="1418" y="728" font-size="18" fill="#0f826d" font-weight="800"><tspan x="1418" dy="0">200</tspan></text><text x="826" y="778" font-size="16" fill="#637d76" font-weight="500"><tspan x="826" dy="0">The read endpoint serves the stored summary; the POST endpoint rebuilds it.</tspan></text><text x="826" y="820" font-size="16" fill="#637d76" font-weight="500"><tspan x="826" dy="0">All analytics routes return JSON and convert database exceptions to HTTP 500.</tspan></text>
<rect x="64" y="912" width="1472" height="86" rx="18" fill="#fff9ee" stroke="#e8d3ad" stroke-width="2"/><text x="92" y="947" font-size="16" fill="#94661a" font-weight="650"><tspan x="92" dy="0">Semantics here: DISCHARGED appointments only; the moving window is seven populated rows, not a calendar scaffold.</tspan></text><line x1="64" y1="1052" x2="1536" y2="1052" stroke="#cfddd8"/><text x="64" y="1078" font-size="14" fill="#637d76" font-weight="500"><tspan x="64" dy="0">Source: supplied api.zip · SQL window functions and materialized view</tspan></text><text x="1435" y="1078" font-size="14" fill="#0f826d" font-weight="700"><tspan x="1435" dy="0">CareConnect</tspan></text></svg>